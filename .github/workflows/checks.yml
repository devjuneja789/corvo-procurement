name: Checks
on:
  push:
    paths-ignore:
      - 'submission/**'
  pull_request:
    paths-ignore:
      - 'submission/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: docker build -t corvo-check .
      - name: Smoke-test container startup and health
        run: |
          docker run -d --name corvo-smoke -p 127.0.0.1:8000:8000 -e RENDER=true -e APP_PASSWORD=ci-only corvo-check
          # Docker publishes the port before Python necessarily starts listening.
          # Retry resets as well as refusals, but fail after a bounded startup window.
          curl --fail --show-error --silent \
            --connect-timeout 2 --max-time 5 \
            --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 60 \
            --output /tmp/corvo-health.json http://127.0.0.1:8000/health
          python -c 'import json; assert json.load(open("/tmp/corvo-health.json"))["status"] == "ok"'
          curl --fail --output /dev/null http://127.0.0.1:8000/
      - name: Container logs
        if: failure()
        run: docker logs corvo-smoke || true
      - name: Clean up container
        if: always()
        run: docker rm -f corvo-smoke || true
