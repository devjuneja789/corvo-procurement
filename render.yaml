services:
  - type: web
    name: corvo-procurement
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: REQUESTER_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
      - key: DATABASE_PATH
        value: /var/data/app.sqlite3
    disk:
      name: procurement-data
      mountPath: /var/data
      sizeGB: 1
